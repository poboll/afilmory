name: Sync Upstream

on:
  schedule:
    - cron: '0 3 * * 1' # 每周一 11:00 北京时间
  workflow_dispatch:
    inputs:
      validate_only:
        description: 'Validate upstream merge without pushing to production'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: sync-upstream-afilmory
  cancel-in-progress: false

jobs:
  sync-upstream:
    runs-on: ubuntu-latest
    if: github.repository == 'poboll/afilmory'
    steps:
      - name: Require repository-scoped sync key
        env:
          SYNC_KEY: ${{ secrets.UPSTREAM_SYNC_SSH_KEY }}
        run: |
          if [ -z "$SYNC_KEY" ]; then
            echo "::error::Configure UPSTREAM_SYNC_SSH_KEY with a write-enabled deploy key for this repository."
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ssh-key: ${{ secrets.UPSTREAM_SYNC_SSH_KEY }}

      - name: Sync Upstream
        run: |
          git remote add upstream https://github.com/Afilmory/Afilmory.git
          git fetch upstream main
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git merge upstream/main --no-edit || {
            echo "::error::上游合并冲突——本地品牌文件（config.json/builder.config.ts/apps/web/index.html）与上游改动重叠，请手动解决"
            exit 1
          }

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install pinned pnpm
        uses: pnpm/action-setup@v4

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build gallery with prebuilt manifest
        env:
          GALLERY_REPO: poboll/gallery-photos
        run: |
          pnpm -w run build:manifest:fetch
          pnpm -w run build

      - name: Push
        # Validation must finish before a merge can reach the production branch.
        if: ${{ !inputs.validate_only }}
        run: git push origin main
